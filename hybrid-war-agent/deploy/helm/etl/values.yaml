image:
  repository: hybrid-war-agent/etl
  tag: latest
  pullPolicy: IfNotPresent

job:
  schedule: "0 * * * *"
  backoffLimit: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

env:
  kinesisStream: "hybrid-war-agent-ingest"
  rawBucket: "hybrid-war-agent-raw"
