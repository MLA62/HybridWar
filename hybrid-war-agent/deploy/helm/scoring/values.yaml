image:
  repository: hybrid-war-agent/scoring
  tag: latest
  pullPolicy: IfNotPresent

job:
  schedule: "*/10 * * * *"
  backoffLimit: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

env:
  rulesPath: "/etc/defcon/rules.yaml"
  alertsTopicArn: ""
