name: Pytest

on:
  push:
    paths:
      - "hybrid-war-agent/tests/**"
      - "hybrid-war-agent/rules.yaml"
      - "hybrid-war-agent/requirements-dev.txt"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "hybrid-war-agent/tests/**"
      - "hybrid-war-agent/rules.yaml"
      - "hybrid-war-agent/requirements-dev.txt"
      - ".github/workflows/pytest.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r hybrid-war-agent/requirements-dev.txt
      - name: Run pytest
        run: pytest hybrid-war-agent/tests
