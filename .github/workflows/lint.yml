name: Lint

on:
  push:
    paths:
      - "hybrid-war-agent/services/**"
      - "hybrid-war-agent/tests/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "hybrid-war-agent/services/**"
      - "hybrid-war-agent/tests/**"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: python -m compileall hybrid-war-agent/services
